name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # Self-healing rebuild: secrets/vars are only read at build time, so a build must
  # happen after they are added. This bakes them in automatically (every 6h).
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  workflow_call:

# Allow one concurrent deployment, cancel queued ones for the same ref
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Resolve Pages URL
        id: pages
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          if [ "${REPO_NAME,,}" = "${OWNER}.github.io" ]; then
            BASE_URL="https://${OWNER}.github.io/"
          else
            BASE_URL="https://${OWNER}.github.io/${REPO_NAME}/"
          fi
          echo "base_url=${BASE_URL}" >> "$GITHUB_OUTPUT"
          echo "Pages URL: ${BASE_URL}"

      - name: Write .env
        env:
          SECRET_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          SECRET_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          VAR_API_ID: ${{ vars.TELEGRAM_API_ID }}
          VAR_API_HASH: ${{ vars.TELEGRAM_API_HASH }}
          APP_TITLE: ${{ vars.APP_TITLE }}
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          API_ID="${SECRET_API_ID:-${VAR_API_ID}}"
          API_HASH="${SECRET_API_HASH:-${VAR_API_HASH}}"

          # Diagnose WHERE the credentials came from (source + length only, never the value).
          ID_SRC="none"
          if [ -n "$SECRET_API_ID" ]; then
            ID_SRC="secret"
          elif [ -n "$VAR_API_ID" ]; then
            ID_SRC="variable"
          fi
          HASH_SRC="none"
          if [ -n "$SECRET_API_HASH" ]; then
            HASH_SRC="secret"
          elif [ -n "$VAR_API_HASH" ]; then
            HASH_SRC="variable"
          fi
          echo "::notice title=Credential sources::api_id=${ID_SRC} (${#API_ID} chars), api_hash=${HASH_SRC} (${#API_HASH} chars) in ${GITHUB_REPOSITORY}"

          if [ -z "$API_ID" ] || [ -z "$API_HASH" ]; then
            echo "::warning title=Telegram API credentials missing::This build got api_id=${ID_SRC}, api_hash=${HASH_SRC}. Add BOTH as *repository* secrets: Settings -> Secrets and variables -> Actions -> Secrets tab (exact names TELEGRAM_API_ID / TELEGRAM_API_HASH, no spaces). Environment secrets do NOT reach this job, and they must be on ${GITHUB_REPOSITORY}. Building a placeholder bundle for now."
            API_ID="1"
            API_HASH="00000000000000000000000000000000"
          fi

          {
            echo "TELEGRAM_API_ID=${API_ID}"
            echo "TELEGRAM_API_HASH=${API_HASH}"
            echo "BASE_URL=${BASE_URL}"
            echo "APP_TITLE=${APP_TITLE:-Telegrow}"
            echo "APP_NAME=${APP_TITLE:-Telegrow}"
          } > .env

          cat .env | sed 's/^TELEGRAM_API_HASH=.*/TELEGRAM_API_HASH=***/'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        env:
          SOURCEMAP: '0'
        run: npm run build:production

      - name: Confirm API credentials landed in the bundle
        run: |
          if grep -rq "00000000000000000000000000000000" dist/assets 2>/dev/null; then
            echo "::warning title=Placeholder credentials in this build::The bundle still contains the placeholder API credentials, so login cannot work. Add TELEGRAM_API_ID and TELEGRAM_API_HASH under Settings -> Secrets and variables -> Actions (exact names, no spaces), then re-run this workflow."
          else
            echo "::notice title=API credentials baked in::Login (QR code and phone number) will work on this build."
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          # Enables GitHub Pages (source: GitHub Actions) on the first run
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
