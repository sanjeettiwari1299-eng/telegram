name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - 'arena/**'
  workflow_dispatch:

# Allow one concurrent deployment, cancel queued ones for the same ref
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Resolve Pages URL
        id: pages
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          if [ "${REPO_NAME,,}" = "${OWNER}.github.io" ]; then
            BASE_URL="https://${OWNER}.github.io/"
          else
            BASE_URL="https://${OWNER}.github.io/${REPO_NAME}/"
          fi
          echo "base_url=${BASE_URL}" >> "$GITHUB_OUTPUT"
          echo "Pages URL: ${BASE_URL}"

      - name: Write .env
        env:
          SECRET_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          SECRET_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          VAR_API_ID: ${{ vars.TELEGRAM_API_ID }}
          VAR_API_HASH: ${{ vars.TELEGRAM_API_HASH }}
          APP_TITLE: ${{ vars.APP_TITLE }}
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          API_ID="${SECRET_API_ID:-${VAR_API_ID}}"
          API_HASH="${SECRET_API_HASH:-${VAR_API_HASH}}"

          if [ -z "$API_ID" ] || [ -z "$API_HASH" ]; then
            echo "::warning title=Telegram API credentials missing::Add TELEGRAM_API_ID and TELEGRAM_API_HASH (from https://my.telegram.org) as repository Secrets to make login work. Building a placeholder bundle for now."
            API_ID="1"
            API_HASH="00000000000000000000000000000000"
          fi

          {
            echo "TELEGRAM_API_ID=${API_ID}"
            echo "TELEGRAM_API_HASH=${API_HASH}"
            echo "BASE_URL=${BASE_URL}"
            echo "APP_TITLE=${APP_TITLE:-Telegrow}"
            echo "APP_NAME=${APP_TITLE:-Telegrow}"
          } > .env

          cat .env | sed 's/^TELEGRAM_API_HASH=.*/TELEGRAM_API_HASH=***/'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        env:
          SOURCEMAP: '0'
        run: npm run build:production

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Enables GitHub Pages (source: GitHub Actions) on the first run
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
