name: Auto-merge bot PRs

# Dependabot opens one grouped PR per week for the GitHub Actions versions used
# by this repo. Patch/minor bumps are merged automatically, so action
# deprecations (e.g. "Node.js 20 is deprecated") fix themselves.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    name: Merge Dependabot PR
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Read update metadata
        id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Approve and merge non-major updates
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr review --approve "$PR_URL" || true
          gh pr merge --squash --delete-branch "$PR_URL"
